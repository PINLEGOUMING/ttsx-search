<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>M3U8播放</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;height:100dvh;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent}
  #video{display:block;width:100%;height:100%;background:#000;object-fit:contain}
  #mask{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#888;font-size:14px;z-index:10;gap:12px;padding:20px;text-align:center;transition:opacity .25s}
  #mask.hide{opacity:0;pointer-events:none}
  .spinner{width:30px;height:30px;border:3px solid #222;border-top-color:#3af;border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #mask.error{color:#f66}
  #mask.error .spinner{display:none}
  #msg{word-break:break-all}
</style>
</head>
<body>
<video id="video" controls autoplay playsinline webkit-playsinline x5-playsinline></video>
<div id="mask"><div class="spinner"></div><div id="msg">加载中…</div></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
(function () {
  var video = document.getElementById('video');
  var mask  = document.getElementById('mask');
  var msgEl = document.getElementById('msg');

  // 只认 url 参数，URLSearchParams 会自动 decode 一次
  var params = new URLSearchParams(location.search);
  var rawUrl = params.get('url') || params.get('u') || params.get('src');

  if (!rawUrl) {
    mask.classList.add('error');
    msgEl.textContent = '缺少 url 参数';
    return;
  }
  // 去掉首尾空白/引号等脏字符
  rawUrl = rawUrl.trim().replace(/^['"]|['"]$/g, '');

  function fail(t) {
    mask.classList.remove('hide');
    mask.classList.add('error');
    msgEl.textContent = t || '播放失败';
  }
  function ready() {
    mask.classList.add('hide');
    video.play().catch(function () {});
  }

  if (window.Hls && Hls.isSupported()) {
    var hls = new Hls({ enableWorker: true, maxBufferLength: 30 });
    hls.loadSource(rawUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, ready);
    hls.on(Hls.Events.ERROR, function (evt, data) {
      if (!data.fatal) return;
      console.error('[HLS]', data.type, data.details, data);
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        // 常见：CORS / 403 auth 过期 / 404
        hls.startLoad();
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else {
        fail('播放失败：' + (data.details || data.type) + '\n（F12 看 Console 详情）');
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = rawUrl;
    video.addEventListener('loadedmetadata', ready);
    video.addEventListener('error', function () { fail('播放失败'); });
  } else {
    fail('当前浏览器不支持 HLS');
  }
})();
</script>
</body>
</html>
