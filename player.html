<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>播放</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; height: 100dvh;
    background: #000; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #video {
    display: block; width: 100%; height: 100%;
    background: #000; object-fit: contain;
  }
  #mask {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #000; color: #888; font-size: 14px;
    z-index: 10; gap: 12px; padding: 20px; text-align: center;
    transition: opacity .25s;
  }
  #mask.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 30px; height: 30px;
    border: 3px solid #222; border-top-color: #3af;
    border-radius: 50%; animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #mask.error { color: #f66; }
  #mask.error .spinner { display: none; }
</style>
</head>
<body>
<video id="video" controls autoplay playsinline webkit-playsinline x5-playsinline></video>
<div id="mask"><div class="spinner"></div><div id="msg">加载中…</div></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
(function () {
  // ===== 1. 从链接里取视频地址（支持 ?url= / ?u= / ?src=）=====
  function getVideoUrl() {
    const search = location.search.slice(1);
    if (!search) return null;
    const idx = search.search(/(?:^|&)(?:url|u|src)=/);
    if (idx === -1) return null;
    const m = search.slice(idx).match(/^&?(?:url|u|src)=/);
    const rawVal = search.slice(idx + m[0].length);

    let decoded;
    try { decoded = decodeURIComponent(rawVal); } catch (e) { decoded = rawVal; }

    if (/^https?:\/\//i.test(decoded)) {
      // 未编码时后面的 &auth=… 会被带进来，这是期望的（保留原始 query）
      // 但要避免吞掉播放器自己的参数
      const playerKeys = ['autoplay','muted','loop','title','poster','controls','v'];
      const amp = decoded.indexOf('&');
      if (amp > -1) {
        const firstKey = decoded.slice(amp + 1).split('=')[0].toLowerCase();
        if (playerKeys.includes(firstKey)) return decoded.slice(0, amp);
      }
      return decoded;
    }
    const params = new URLSearchParams(location.search);
    return params.get('url') || params.get('u') || params.get('src');
  }

  // ===== 2. 要用 ccc.com 代理时改这一行 =====
  function buildFinalUrl(rawUrl) {
    return rawUrl; // 直连
  }

  // ===== 3. 播放 =====
  const video = document.getElementById('video');
  const mask  = document.getElementById('mask');
  const msg   = document.getElementById('msg');

  const rawUrl = getVideoUrl();
  if (!rawUrl) {
    mask.classList.add('error');
    msg.textContent = '缺少视频地址参数';
    return;
  }
  const finalUrl = buildFinalUrl(rawUrl);

  function fail(t) {
    mask.classList.remove('hide');
    mask.classList.add('error');
    msg.textContent = t || '播放失败';
  }
  function ready() {
    mask.classList.add('hide');
    video.play().catch(function () {}); // 自动播放被拦时，用户点原生按钮即可
  }

  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({ enableWorker: true, lowLatencyMode: true, maxBufferLength: 30 });
    hls.loadSource(finalUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, ready);
    hls.on(Hls.Events.ERROR, function (evt, data) {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        hls.startLoad();
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else {
        fail('播放失败：' + (data.details || data.type));
        hls.destroy();
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // iOS Safari 原生 HLS
    video.src = finalUrl;
    video.addEventListener('loadedmetadata', ready);
    video.addEventListener('error', function () { fail('播放失败'); });
  } else {
    fail('当前浏览器不支持 HLS 播放');
  }
})();
</script>
</body>
</html>
